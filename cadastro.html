 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários</title>
    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Cadastro de Usuários</h1>
            <p>Cadastre, edite ou remova usuários do sistema.</p>
        </header>

        <section class="card">

            <h2 id="tituloFormulario">Cadastrar Usuário</h2>

            <form id="formUsuario">

                <input type="hidden" id="indiceEdicao">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite o e-mail"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite a senha"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="tipo">Tipo de usuário</label>

                    <select id="tipo" required>
                        <option value="">Selecione</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Funcionário">Funcionário</option>
                    </select>
                </div>

                <div class="botoes">
                    <button type="submit" class="btn-cadastrar" id="btnSalvar">
                        Cadastrar
                    </button>

                    <button
                        type="button"
                        class="btn-cancelar"
                        id="btnCancelar"
                        onclick="cancelarEdicao()"
                    >
                        Cancelar
                    </button>
                </div>

            </form>

        </section>


        <section class="card">

            <div class="topo-tabela">
                <h2>Usuários cadastrados</h2>

                <span id="contador">
                    0 usuários
                </span>
            </div>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Tipo</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaUsuarios">
                        <!-- Usuários aparecerão aqui -->
                    </tbody>

                </table>

            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
