<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Departamentos</title>

    <link rel="stylesheet" href="css/home.css">

</head>

<body>


    <!-- CABEÇALHO -->

    <header class="cabecalho">

        <!-- BOTÃO MENU -->

        <button
            id="menuButton"
            class="menu-button"
        >

            ☰

        </button>


        <!-- USUÁRIO -->

        <div class="usuario">

            <div class="avatar"></div>

            <div class="informacoes">

                <strong>
                    Nome do Usuario
                </strong>

                <span>
                    Função do Usuário
                </span>

            </div>

        </div>

    </header>

<!-- MENU LATERAL -->

    <aside
        id="menuLateral"
        class="menu-lateral"
    >

        <button
            id="funcionariosButton"
            class="menu-item"
        >

            Funcionários

        </button>


        <button
            id="departamentosButton"
            class="menu-item"
        >

            Departamentos

        </button>

    </aside>

    <!-- FUNDO ESCURO -->

    <div
        id="fundo"
        class="fundo"
    ></div>

    <!-- CONTEÚDO PRINCIPAL -->

    <main class="conteudo">


        <!-- TÍTULO -->

        <div class="topo-conteudo">


            <button
                id="novoDepartamento"
                class="novo-departamento"
            >

                + Novo Departamento

            </button>

        </div>

        <!-- CARDS -->

        <section class="cards">


            <!-- CARD 1 -->

            <div class="card">

                <h2>
                    Departamento
                </h2>

                <p>
                    Nome do funcionário responsável
                </p>

                <span>
                    X projetos ativos
                </span>

            </div>



            <!-- CARD 2 -->

            <div class="card">

                <h2>
                    Departamento
                </h2>

                <p>
                    Nome do funcionário responsável
                </p>

                <span>
                    X projetos ativos
                </span>

            </div>



            <!-- CARD 3 -->

            <div class="card">

                <h2>
                    Departamento
                </h2>

                <p>
                    Nome do funcionário responsável
                </p>

                <span>
                    X projetos ativos
                </span>

            </div>


        </section>

    </main>



    <!-- JAVASCRIPT -->

    <script src="home.js"></script>

</body>

</html>
