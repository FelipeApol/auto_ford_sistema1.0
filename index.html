 <!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sistema</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="container">

        <!-- LADO ESQUERDO -->
        <div class="login">

            <form id="loginForm">

                <input
                    type="text"
                    id="usuario"
                    placeholder="Usuário"
                >

                <input
                    type="password"
                    id="senha"
                    placeholder="Senha"
                >

                <button type="submit">
                    Login
                </button>

                <p id="mensagem"></p>

            </form>

        </div>


        <!-- LADO DIREITO -->
        <div class="imagem">

            <img src="imagens/imangem-do-login.jpeg" >

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
